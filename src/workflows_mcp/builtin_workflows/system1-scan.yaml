name: system1-scan
description: |
  Per-file system-1 structural scan: parse a source file with TreeSitter and
  store the resulting entity and relation graph in the memory palace.

  Steps:
    1. Parse the file with TreeSitter to extract entities, relations, and file
       metadata (content_hash, size_bytes, mtime_ns).
    2. Ensure the file exists as a knowledge_items row (ensure_item) using the
       metadata from the parse step — idempotent upsert.
    3. Store extracted entities (store_entities) — idempotent upsert.
    4. Store extracted relations by qualified name (store_relations_by_qname) — idempotent.

  Idempotency: unchanged second run inserts zero new rows in all three tables
  (knowledge_items, knowledge_entities, knowledge_relations).

  Palace isolation is preserved through the scope envelope passed to every
  Memory block. The `palace` input controls which palace receives the data.

tags: [builtin, treesitter, memory, system1]

inputs:
  file_path:
    type: str
    description: "Absolute or workspace-relative path to the file to scan."

  repo_relative_path:
    type: str
    description: "Path of the file relative to the repository root (used for qualified names and item lookup)."

  palace:
    type: str
    description: "Memory palace to store entities and relations in."

  source_name:
    type: str
    description: "Logical source name (e.g. repository name) used for the knowledge_sources row."

  wing:
    type: str
    default: "code"
    description: "Memory wing within the palace. Defaults to 'code'."

  room:
    type: str
    default: "default"
    description: "Memory room within the wing. Defaults to 'default'."

  compartment:
    type: str
    default: "system1scan"
    description: "Memory compartment within the room. Defaults to 'system1scan'."

blocks:
  - id: parse_file
    description: "Parse the source file with TreeSitter and extract entities, relations, and file metadata."
    type: TreeSitter
    inputs:
      path: "{{inputs.file_path}}"
      repo_relative_path: "{{inputs.repo_relative_path}}"
      palace: "{{inputs.palace}}"

  - id: ensure_item
    description: "Register the file as a knowledge_items row (upsert — idempotent)."
    type: Memory
    inputs:
      operation: ensure_item
      scope:
        palace: "{{inputs.palace}}"
        wing: "{{inputs.wing}}"
        room: "{{inputs.room}}"
        compartment: "{{inputs.compartment}}"
      record:
        format: raw
        source: "{{inputs.source_name}}"
        path: "{{inputs.repo_relative_path}}"
        item:
          language: "{{blocks.parse_file.outputs.language}}"
          content_hash: "{{blocks.parse_file.outputs.content_hash}}"
          size_bytes: "{{blocks.parse_file.outputs.size_bytes}}"
          mtime_ns: "{{blocks.parse_file.outputs.mtime_ns}}"
    depends_on: [parse_file]

  - id: store_entities
    description: "Store extracted entities in the palace (idempotent upsert by stable_id)."
    type: Memory
    inputs:
      operation: store_entities
      scope:
        palace: "{{inputs.palace}}"
        wing: "{{inputs.wing}}"
        room: "{{inputs.room}}"
        compartment: "{{inputs.compartment}}"
      record:
        format: structured
        source: STRUCTURAL
        item:
          id: "{{blocks.ensure_item.outputs.result.manage.item_id}}"
        entities: "{{blocks.parse_file.outputs.entities}}"
    depends_on: [ensure_item]

  - id: store_relations
    description: "Store extracted structural relations by qualified name (idempotent)."
    type: Memory
    inputs:
      operation: store_relations_by_qname
      scope:
        palace: "{{inputs.palace}}"
        wing: "{{inputs.wing}}"
        room: "{{inputs.room}}"
        compartment: "{{inputs.compartment}}"
      graph:
        relations: "{{blocks.parse_file.outputs.relations}}"
        external_fallback: module
    depends_on: [store_entities]

outputs:
  language:
    value: "{{blocks.parse_file.outputs.language}}"
    type: str
  content_hash:
    value: "{{blocks.parse_file.outputs.content_hash}}"
    type: str
  entities_stored:
    value: "{{blocks.store_entities.succeeded}}"
    type: bool
  relations_stored:
    value: "{{blocks.store_relations.succeeded}}"
    type: bool
