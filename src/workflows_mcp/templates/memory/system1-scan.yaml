name: system1-scan
description: |
  ADR-013 System 1 topology derivation scan: parse a source file with
  TreeSitter, persist the raw structural graph, and then derive complete
  topology (wing/room/compartment) via Memory operations.

  Steps:
    1. Parse the file with TreeSitter to extract structural entities,
        relations, and structural evidence candidates (entities, relations,
        file metadata only — no topology fields).
    2. Persist the parsed System 1 structural graph via
       store_system1_structural_graph using raw entities/relations,
       unresolved imports, structural evidence items, and parser metadata.
    3. Call derive_system1_topology with the parsed structural evidence
       payload and optional explicit topology overrides. The operation derives
       wing/room/compartment from persisted evidence (or applies explicit
       override), persists provenance, and returns typed derivation fields.

  Topology: Palace / Wing / Room / Compartment only.
  Corridors are directed typed relations; they are never encoded as a
  topology level in scope fields or evidence entity types.

  Derivation precedence (service-side, not workflow-side):
    1. Explicit topology_override (when caller provides full override payload).
    2. System 1 structural derivation from parsed evidence.
    3. Fail closed with MEM_INSUFFICIENT_EVIDENCE.

  Idempotency is managed by the Memory service (evidence upsert + append-only
  provenance rows).

tags: [builtin, treesitter, memory, system1, adr013]

inputs:
  file_path:
    type: str
    description: "Absolute or workspace-relative path to the file to scan."

  repo_relative_path:
    type: str
    description: "Path of the file relative to the repository root (used for qualified names and item lookup)."

  palace:
    type: str
    description: "Memory palace to store structural evidence in."

  source_name:
    type: str
    description: "Logical source name (e.g. repository name) used for the knowledge_sources row."

  topology_override:
    type: dict
    required: false
    description: |
      Optional explicit topology override. When provided, must be a complete
      payload with wing, room, compartment, override_reason, and applied_by.
      Passed through to the derive_system1_topology operation unchanged.

blocks:
  - id: parse_file
    description: "Parse the source file with TreeSitter; produces structural entities, relations, and evidence candidates (no topology fields)."
    type: TreeSitter
    inputs:
      path: "{{inputs.file_path}}"
      repo_relative_path: "{{inputs.repo_relative_path}}"
      palace: "{{inputs.palace}}"

  - id: persist_structural_graph
    description: "Persist raw System 1 structural graph before topology derivation."
    type: Memory
    inputs:
      operation: store_system1_structural_graph
      scope:
        palace: "{{inputs.palace}}"
      record:
        system1_graph:
          palace: "{{inputs.palace}}"
          source_name: "{{inputs.source_name}}"
          repo_relative_path: "{{inputs.repo_relative_path}}"
          parser_metadata:
            language: "{{blocks.parse_file.outputs.language}}"
            path: "{{inputs.repo_relative_path}}"
            source: "{{inputs.source_name}}"
            content_hash: "{{blocks.parse_file.outputs.content_hash}}"
            size_bytes: "{{blocks.parse_file.outputs.size_bytes}}"
            mtime_ns: "{{blocks.parse_file.outputs.mtime_ns}}"
          entities: "{{blocks.parse_file.outputs.entities}}"
          relations: "{{blocks.parse_file.outputs.relations}}"
          unresolved_imports: "{{blocks.parse_file.outputs.unresolved_imports}}"
          structural_evidence: "{{blocks.parse_file.outputs.structural_evidence_items}}"
    depends_on: [parse_file]

  - id: derive_topology
    description: "Derive System 1 topology from parsed structural evidence via one Memory operation. Derivation remains fail-closed, but does not block successful structural graph persistence."
    type: Memory
    inputs:
      operation: derive_system1_topology
      scope:
        palace: "{{inputs.palace}}"
      derivation:
        palace: "{{inputs.palace}}"
        inline_candidates: "{{blocks.parse_file.outputs.structural_evidence_items}}"
        parser_metadata:
          language: "{{blocks.parse_file.outputs.language}}"
          path: "{{inputs.repo_relative_path}}"
          source: "{{inputs.source_name}}"
          content_hash: "{{blocks.parse_file.outputs.content_hash}}"
          size_bytes: "{{blocks.parse_file.outputs.size_bytes}}"
          mtime_ns: "{{blocks.parse_file.outputs.mtime_ns}}"
        topology_override: "{{inputs.topology_override}}"
    depends_on: [persist_structural_graph]
    condition: "{{inputs.topology_override is defined and inputs.topology_override is not none}}"
    continue_on_error: true

outputs:
  language:
    value: "{{blocks.parse_file.outputs.language}}"
    type: str
  content_hash:
    value: "{{blocks.parse_file.outputs.content_hash}}"
    type: str
  derived_wing:
    value: "{{blocks.derive_topology.outputs.result.manage.derived_wing if blocks.derive_topology.succeeded else ''}}"
    type: str
  derived_room:
    value: "{{blocks.derive_topology.outputs.result.manage.derived_room if blocks.derive_topology.succeeded else ''}}"
    type: str
  derived_compartment:
    value: "{{blocks.derive_topology.outputs.result.manage.derived_compartment if blocks.derive_topology.succeeded else ''}}"
    type: str
  derivation_source:
    value: "{{blocks.derive_topology.outputs.result.manage.derivation_source if blocks.derive_topology.succeeded else ''}}"
    type: str
  provenance_id:
    value: "{{blocks.derive_topology.outputs.result.manage.provenance_id if blocks.derive_topology.succeeded else ''}}"
    type: str
  claim_id:
    value: "{{blocks.derive_topology.outputs.result.manage.claim_id if blocks.derive_topology.succeeded else ''}}"
    type: str
  evidence_stored:
    value: "{{blocks.derive_topology.succeeded}}"
    type: bool
  graph_diagnostics:
    value: "{{blocks.persist_structural_graph.outputs.result.manage.diagnostics}}"
    type: dict
