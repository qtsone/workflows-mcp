name: system1-scan
description: |
  ADR-013 System 1 topology derivation scan: parse a source file with
  TreeSitter and derive complete topology (wing/room/compartment) via a
  single Memory derive_system1_topology operation.

  Steps:
    1. Parse the file with TreeSitter to extract structural entities,
       relations, and structural evidence candidates (entities, relations,
       file metadata only — no topology fields).
    2. Call one Memory derive_system1_topology operation with the parsed
       structural evidence payload and optional explicit topology overrides.
       The operation derives wing/room/compartment from structural evidence
       (or applies the explicit override if provided), persists provenance,
       and returns typed derivation result fields.

  Topology: Palace / Wing / Room / Compartment only.
  Corridors are directed typed relations; they are never encoded as a
  topology level in scope fields or evidence entity types.

  Derivation precedence (service-side, not workflow-side):
    1. Explicit topology_override (when caller provides full override payload).
    2. System 1 structural derivation from parsed evidence.
    3. Fail closed with MEM_INSUFFICIENT_EVIDENCE.

  Idempotency is managed by the Memory service (evidence upsert + append-only
  provenance rows).

tags: [builtin, treesitter, memory, system1, adr013]

inputs:
  file_path:
    type: str
    description: "Absolute or workspace-relative path to the file to scan."

  repo_relative_path:
    type: str
    description: "Path of the file relative to the repository root (used for qualified names and item lookup)."

  palace:
    type: str
    description: "Memory palace to store structural evidence in."

  source_name:
    type: str
    description: "Logical source name (e.g. repository name) used for the knowledge_sources row."

  topology_override:
    type: dict
    required: false
    description: |
      Optional explicit topology override. When provided, must be a complete
      payload with wing, room, compartment, override_reason, and applied_by.
      Passed through to the derive_system1_topology operation unchanged.

blocks:
  - id: parse_file
    description: "Parse the source file with TreeSitter; produces structural entities, relations, and evidence candidates (no topology fields)."
    type: TreeSitter
    inputs:
      path: "{{inputs.file_path}}"
      repo_relative_path: "{{inputs.repo_relative_path}}"
      palace: "{{inputs.palace}}"

  - id: derive_topology
    description: "Derive System 1 topology from parsed structural evidence via one Memory operation. Fails closed if topology cannot be fully determined."
    type: Memory
    inputs:
      operation: derive_system1_topology
      scope:
        palace: "{{inputs.palace}}"
      derivation:
        palace: "{{inputs.palace}}"
        inline_candidates: "{{blocks.parse_file.outputs.structural_evidence_items}}"
        parser_metadata:
          language: "{{blocks.parse_file.outputs.language}}"
          path: "{{inputs.repo_relative_path}}"
          source: "{{inputs.source_name}}"
          content_hash: "{{blocks.parse_file.outputs.content_hash}}"
          size_bytes: "{{blocks.parse_file.outputs.size_bytes}}"
          mtime_ns: "{{blocks.parse_file.outputs.mtime_ns}}"
        topology_override: "{{inputs.topology_override}}"
    depends_on: [parse_file]

outputs:
  language:
    value: "{{blocks.parse_file.outputs.language}}"
    type: str
  content_hash:
    value: "{{blocks.parse_file.outputs.content_hash}}"
    type: str
  derived_wing:
    value: "{{blocks.derive_topology.outputs.result.manage.derived_wing}}"
    type: str
  derived_room:
    value: "{{blocks.derive_topology.outputs.result.manage.derived_room}}"
    type: str
  derived_compartment:
    value: "{{blocks.derive_topology.outputs.result.manage.derived_compartment}}"
    type: str
  derivation_source:
    value: "{{blocks.derive_topology.outputs.result.manage.derivation_source}}"
    type: str
  provenance_id:
    value: "{{blocks.derive_topology.outputs.result.manage.provenance_id}}"
    type: str
  claim_id:
    value: "{{blocks.derive_topology.outputs.result.manage.claim_id}}"
    type: str
  evidence_stored:
    value: "{{blocks.derive_topology.succeeded}}"
    type: bool
